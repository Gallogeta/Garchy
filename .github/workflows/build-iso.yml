name: Build Garchy Linux ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ISO inside Arch Linux Container
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            archlinux:base-devel bash -c "
              pacman -Syu --noconfirm archiso git sudo &&
              mkdir -p /output &&
              mkarchiso -v -w /tmp/archiso-work -o /output /workspace/archiso &&
              cd /output && sha256sum *.iso > sha256sums.txt &&
              cp -r /output/* /workspace/
            "

      - name: Generate Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
