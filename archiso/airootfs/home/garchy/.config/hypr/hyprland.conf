# ~/.config/hypr/hyprland.conf
# Garchy OS — 144Hz Glassmorphic Desktop + Built-in Cephalon Gally AI

# --------------------------------------------------
# MONITORS
# --------------------------------------------------
monitor = , preferred, auto, 1

# --------------------------------------------------
# DEFAULT PROGRAMS
# --------------------------------------------------
$mainMod = SUPER
$terminal = kitty
$menu = rofi -show drun -config ~/.config/rofi/config.rasi
$windowMenu = ~/.config/hypr/scripts/window-switch.sh
$fileManager = thunar
$browser = firefox

# --------------------------------------------------
# AUTOSTART
# --------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = awww-daemon
exec-once = ~/.config/hypr/scripts/wallpaper-timer.sh daemon 600
exec-once = python3 ~/.config/hypr/scripts/gally-wallpaper-bridge.py

# --------------------------------------------------
# ENVIRONMENT VARIABLES
# --------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# --------------------------------------------------
# INPUT
# --------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# --------------------------------------------------
# GENERAL & DECORATION
# --------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(00f0ffee) rgba(fbbf24ee) 45deg
    col.inactive_border = rgba(1e293baa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 5
        passes = 2
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# --------------------------------------------------
# LAYER RULES
# --------------------------------------------------
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, dunst
layerrule = ignorezero, dunst
layerrule = blur, wlogout
layerrule = ignorezero, wlogout

# --------------------------------------------------
# WINDOW RULES (Standard Modern Hyprland Syntax)
# --------------------------------------------------
windowrulev2 = suppressevent maximize, class:.*

windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|blueman-manager|org\.pulseaudio\.pavucontrol)$
windowrulev2 = center, class:^(pavucontrol|nm-connection-editor|blueman-manager|org\.pulseaudio\.pavucontrol)$
windowrulev2 = size 700 500, class:^(pavucontrol|nm-connection-editor|blueman-manager|org\.pulseaudio\.pavucontrol)$

windowrulev2 = float, class:^(gally_cephalon_hud|gally_launchpad|gally_wallpaper_gallery|gally_theme_gallery|gally_visualizer)$
windowrulev2 = center, class:^(gally_cephalon_hud|gally_launchpad|gally_wallpaper_gallery|gally_theme_gallery|gally_visualizer)$
windowrulev2 = size 1040 740, class:^(gally_cephalon_hud)$
windowrulev2 = size 900 640, class:^(gally_launchpad)$
windowrulev2 = size 940 680, class:^(gally_wallpaper_gallery)$
windowrulev2 = size 820 620, class:^(gally_theme_gallery)$

windowrulev2 = float, title:^(.*Garchy OS.*)$
windowrulev2 = center, title:^(.*Garchy OS.*)$
windowrulev2 = size 920 640, title:^(.*Garchy OS.*)$

windowrulev2 = float, title:^(.*Gally.*)$
windowrulev2 = center, title:^(.*Gally.*)$
windowrulev2 = size 1040 740, title:^(.*Gally.*)$

# --------------------------------------------------
# KEYBINDINGS
# --------------------------------------------------
# Gally Launchpad, Gally AI Hub & Quick Help
bind = $mainMod, Space, exec, ~/.config/hypr/scripts/launchpad.sh
bind = $mainMod SHIFT, Space, exec, ~/.config/hypr/scripts/gally-ai-hud.sh
bind = $mainMod, I, exec, ~/.config/hypr/scripts/gally-ai-hud.sh
bind = , F1, exec, ~/.config/hypr/scripts/help-hud.sh
bind = $mainMod, Slash, exec, ~/.config/hypr/scripts/help-hud.sh

# Core Launchers
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod, D, exec, ~/.config/hypr/scripts/rofi-launcher.sh
bind = $mainMod, R, exec, ~/.config/hypr/scripts/rofi-launcher.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/force-kill.sh
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper-select.sh
bind = $mainMod, C, exec, ~/.config/hypr/scripts/theme-switcher.sh
bind = $mainMod, V, exec, ~/.config/hypr/scripts/clipboard-manager.sh
bind = $mainMod, A, exec, ~/.config/hypr/scripts/easyeffects-menu.sh
bind = $mainMod, Escape, exec, wlogout -b 2 -c 20 -r 20

# Window Management
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
bind = $mainMod ALT, Space, exec, ~/.config/hypr/scripts/togglefloat.sh
bind = ALT, Tab, exec, ~/.config/hypr/scripts/window-switch.sh

# Navigation & Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Screenshots
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh full

# Mouse Window Control
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
exec-once = sleep 1 && sudo /usr/bin/garchy-gui-installer
