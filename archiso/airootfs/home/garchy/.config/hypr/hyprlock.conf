# ~/.config/hypr/hyprlock.conf
# 🌌 Garchy OS — Glassmorphic Security Lock Screen
# Visual design themed around garchy-minimal.jpg with Orokin Gold & Electric Cyan accents

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/garchy-minimal.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.90
    brightness = 0.75
    vibrancy = 0.25
    vibrancy_darkness = 0.25
}

# GARCHY OS HEADER GLYPH
label {
    monitor =
    text = 🌌 GARCHY OS
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    color = rgba(56, 189, 248, 0.9)

    position = 0, -60
    halign = center
    valign = top
}

# TIME (Hours : Minutes)
label {
    monitor =
    text = $TIME
    font_size = 84
    font_family = JetBrainsMono Nerd Font Bold
    color = rgba(241, 245, 249, 0.98)

    position = 0, -90
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 15
    font_family = $font
    color = rgba(251, 191, 36, 0.85)

    position = 0, -210
    halign = center
    valign = top
}

# INPUT FIELD (Electric Cyan & Gold Glowing Pill)
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    inner_color = rgba(10, 15, 29, 0.75)

    outer_color = rgba(56, 189, 248, 0.85) rgba(251, 191, 36, 0.85) 45deg
    check_color = rgba(52, 211, 153, 0.9) rgba(56, 189, 248, 0.9) 120deg
    fail_color = rgba(244, 63, 94, 0.9) rgba(251, 191, 36, 0.9) 40deg

    font_color = rgb(241, 245, 249)
    fade_on_empty = false
    rounding = 16

    font_family = $font
    placeholder_text = <span foreground="##94a3b8"><i>󰌾  Enter Passcode...</i></span>
    fail_text = <span foreground="##f43f5e"><i>Access Denied ($ATTEMPTS)</i></span>

    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true

    position = 0, -20
    halign = center
    valign = center
}

# CEPHALON SECURITY SENTINEL STATUS
label {
    monitor =
    text = 🛡️ Cephalon Security Sentinel: Standby Active
    font_size = 11
    font_family = $font
    color = rgba(148, 163, 184, 0.75)

    position = 0, -75
    halign = center
    valign = center
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = 🌐 $LAYOUT[en,ru]
    font_size = 11
    font_family = $font
    color = rgba(56, 189, 248, 0.8)
    onclick = hyprctl switchxkblayout all next

    position = 0, 70
    halign = center
    valign = bottom
}

# NOW PLAYING
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/now-playing.sh
    font_size = 12
    font_family = $font
    color = rgba(241, 245, 249, 0.85)

    position = 0, 35
    halign = center
    valign = bottom
}
