# ~/.config/hypr/hyprlock.conf
# Glassmorphic Lockscreen

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.89
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# TIME (Hours : Minutes)
label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    color = rgba(240, 245, 255, 0.95)

    position = 0, -120
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 16
    font_family = $font
    color = rgba(192, 202, 245, 0.8)

    position = 0, -230
    halign = center
    valign = top
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    inner_color = rgba(18, 20, 30, 0.65)

    outer_color = rgba(122, 162, 247, 0.8) rgba(187, 154, 247, 0.8) 45deg
    check_color = rgba(115, 218, 202, 0.8) rgba(122, 162, 247, 0.8) 120deg
    fail_color = rgba(247, 118, 142, 0.8) rgba(255, 158, 100, 0.8) 40deg

    font_color = rgb(240, 245, 255)
    fade_on_empty = false
    rounding = 14

    font_family = $font
    placeholder_text = <span foreground="##565f89"><i>󰌾  Enter Password...</i></span>
    fail_text = <span foreground="##f7768e"><i>$FAIL ($ATTEMPTS)</i></span>

    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true

    position = 0, -20
    halign = center
    valign = center
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 12
    font_family = $font
    color = rgba(120, 124, 153, 0.8)
    onclick = hyprctl switchxkblayout all next

    position = 0, -75
    halign = center
    valign = center
}

# NOW PLAYING
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/now-playing.sh
    font_size = 13
    font_family = $font
    color = rgba(192, 202, 245, 0.85)

    position = 0, 70
    halign = center
    valign = bottom
}
