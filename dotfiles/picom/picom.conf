# ==============================================================================
# 🌌 Garchy OS — Ultra-Glassy Picom Compositor Configuration
# ==============================================================================

backend = "glx";
use-damage = true;
vsync = true;
unredir-if-possible = true;

# --- Rounded Corners ---
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'desktop'"
];

# --- Drop Shadows ---
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.65;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Xfce4-screenshooter'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS"
];

# --- Smooth Fading ---
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;
fade-exclude = [
  "class_g = 'slop'"
];

# --- Dual-Kawase Glass Background Blur (Optimized for 4GB RAM & Low-End GPUs) ---
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = true;
  background-fixed = false;
};

blur-background = true;
blur-background-frame = true;

blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "class_g = 'Xfce4-screenshooter'",
  "_GTK_FRAME_EXTENTS"
];

# --- Translucency & Glass Rules ---
inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 0.90;
inactive-opacity-override = false;

opacity-rule = [
  "80:class_g = 'Xfce4-panel'",
  "82:class_g = 'whiskermenu-window'",
  "82:class_g = 'Rofi'",
  "82:class_g = 'kitty'",
  "86:class_g = 'Thunar'",
  "84:class_g = 'Xfce4-appfinder'",
  "85:class_g = 'pavucontrol'",
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'firefox'",
  "100:class_g = 'zen'",
  "100:class_g = 'mpv'",
  "100:class_g = 'vlc'",
  "100:class_g = 'Gwenview'",
  "100:class_g = 'Haruna'"
];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.90; focus = true; full-shadow = false; };
  dock = { shadow = true; clip-shadow-above = false; opacity = 0.82; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.88; shadow = true; };
  dropdown_menu = { opacity = 0.88; shadow = true; };
};
