# ==============================================================================
# 🌌 Garchy OS — Ultra-Smooth & Low-Latency Picom Compositor (144Hz Optimized)
# ==============================================================================

backend = "glx";
xrender-sync-fence = true;
use-damage = true;
vsync = true;
unredir-if-possible = true;

# --- Rounded Corners ---
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'desktop'"
];

# --- Drop Shadows ---
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.60;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Xfce4-screenshooter'",
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS"
];

# --- Snappy 144Hz Smooth Fading (Zero Delay) ---
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;
fade-exclude = [
  "class_g = 'slop'"
];

# --- High-Performance Dual-Kawase Glass Blur ---
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = true;
  background-fixed = true; # Fixed background sampling eliminates window drag stutter
};

blur-background = true;
blur-background-frame = true;

blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "window_type = 'tooltip'",
  "class_g = 'slop'",
  "class_g = 'Xfce4-screenshooter'",
  "_GTK_FRAME_EXTENTS"
];

# --- Translucency & Glass Rules ---
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 0.92;
inactive-opacity-override = false;

opacity-rule = [
  "80:class_g = 'Xfce4-panel'",
  "82:class_g = 'whiskermenu-window'",
  "82:class_g = 'Rofi'",
  "82:class_g = 'kitty'",
  "88:class_g = 'Thunar'",
  "85:class_g = 'Xfce4-appfinder'",
  "88:class_g = 'pavucontrol'",
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'firefox'",
  "100:class_g = 'zen'",
  "100:class_g = 'mpv'",
  "100:class_g = 'vlc'",
  "100:class_g = 'Gwenview'",
  "100:class_g = 'Haruna'",
  "100:class_g = 'Steam'",
  "100:class_g = 'heroic'"
];

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.90; focus = true; full-shadow = false; };
  dock = { shadow = true; clip-shadow-above = false; opacity = 0.82; };
  dnd = { shadow = false; blur-background = false; };
  popup_menu = { opacity = 0.90; shadow = true; };
  dropdown_menu = { opacity = 0.90; shadow = true; };
};
