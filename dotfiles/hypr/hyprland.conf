# ~/.config/hypr/hyprland.conf
# Modern Glassmorphic Rice for CachyOS + Dual 144Hz + NVIDIA RTX 3080 Ti + Ryzen 9 5900X

# --------------------------------------------------
# MONITORS (Left: DP-2 @ 144Hz, Right: DP-1 @ 144Hz)
# --------------------------------------------------
monitor = DP-2, 1920x1080@144, 0x0, 1
monitor = DP-1, 1920x1080@144, 1920x0, 1
monitor = , preferred, auto, 1

# Paired Dual-Monitor Workspaces (Left: DP-2, Right: DP-1)
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-1, default:true
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-1
workspace = 11, monitor:DP-2
workspace = 12, monitor:DP-1
workspace = 13, monitor:DP-2
workspace = 14, monitor:DP-1
workspace = 15, monitor:DP-2
workspace = 16, monitor:DP-1
workspace = 17, monitor:DP-2
workspace = 18, monitor:DP-1
workspace = 19, monitor:DP-2
workspace = 20, monitor:DP-1

# --------------------------------------------------
# DEFAULT PROGRAMS
# --------------------------------------------------
$mainMod = SUPER
$terminal = ~/.local/bin/garchy-terminal
$menu = rofi -show drun -config ~/.config/rofi/config.rasi
$windowMenu = ~/.config/hypr/scripts/window-switch.sh
$fileManager = thunar
$browser = brave

# --------------------------------------------------
# AUTOSTART
# --------------------------------------------------
# D-Bus and Systemd environment synchronization
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Core Daemons & Rice Utilities
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = dunst
exec-once = easyeffects --service-mode
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = awww-daemon
exec-once = ~/.config/hypr/scripts/wallpaper-timer.sh daemon 600
exec-once = ~/.config/hypr/scripts/gally-drive-automount.py

# --------------------------------------------------
# ENVIRONMENT VARIABLES (NVIDIA + Wayland)
# --------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# NVIDIA & Aquamarine
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = AQ_DRM_DEVICES,/dev/dri/card1
env = GBM_BACKEND,nvidia-drm
env = XDG_SESSION_TYPE,wayland

# Toolkit Hints
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# --------------------------------------------------
# ECOSYSTEM
# --------------------------------------------------
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# --------------------------------------------------
# INPUT (Estonian Keyboard Primary - No accidental layout toggles)
# --------------------------------------------------
input {
    kb_layout = ee
    kb_options =
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

# --------------------------------------------------
# LOOK AND FEEL (Modern Glassmorphic - Straight Corners)
# --------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(24283b88)

    resize_on_border = true
    allow_tearing = true
    layout = dwindle
}

$window_opacity = 1.0

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
        vibrancy = 0.25
        contrast = 0.9
        brightness = 0.9
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(05081166)
    }
}

animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.05
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = smoothOut, 0.25, 1, 0.5, 1

    animation = windows, 1, 4, wind, popin 80%
    animation = windowsIn, 1, 4, winIn, popin 80%
    animation = windowsOut, 1, 3, winOut, popin 85%
    animation = windowsMove, 1, 4, wind, slide
    animation = border, 1, 4, liner
    animation = borderangle, 1, 20, liner, loop
    animation = fade, 1, 3, smoothOut
    animation = workspaces, 1, 4, smoothOut, slidefade 20%
    animation = specialWorkspace, 1, 4, wind, slidefadevert 20%
    animation = layers, 1, 3.5, winIn, popin 85%
    animation = layersIn, 1, 3.5, winIn, popin 85%
    animation = layersOut, 1, 2.5, winOut, popin 85%
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
    mouse_move_focuses_monitor = false
}

cursor {
    no_hardware_cursors = 2
    enable_hyprcursor = true
    sync_gsettings_theme = true
    no_warps = false
}

xwayland {
    force_zero_scaling = true
}

render {
    direct_scanout = 0
}

# --------------------------------------------------
# WINDOW & LAYER RULES (Hyprland v0.56+ Syntax)
# --------------------------------------------------
# Frosted Blur Layers
layerrule = blur 1, match:namespace ^(waybar|rofi|wlogout|dunst)$
layerrule = ignore_alpha 0.2, match:namespace ^(waybar|rofi|wlogout|dunst)$

# Suppress maximize events
windowrule = suppress_event maximize, match:class ^(.*)$

# Application Opacity Rules
windowrule = opacity 1.0 1.0 1.0, match:class ^(kitty|xed|thunar|[bB]rave-browser|firefox|discord|vesktop|codium|Code|code-oss|GeForceNOW|obsidian|Spotify|spotify|org\.pulseaudio\.pavucontrol|com\.github\.johnfactotum\.Foliate)$

# Floating System Dialogs & Garchy HUDs
windowrule = float 1, match:class ^(pavucontrol|nm-connection-editor|blueman-manager|org\.pulseaudio\.pavucontrol)$
windowrule = center 1, match:class ^(pavucontrol|nm-connection-editor|blueman-manager|org\.pulseaudio\.pavucontrol)$
windowrule = size 700 500, match:class ^(pavucontrol|nm-connection-editor|blueman-manager|org\.pulseaudio\.pavucontrol)$
windowrule = float 1, match:title ^(Open File|Save File|Authentication Required|Confirm to replace files|File Upload|All Files)$
windowrule = center 1, match:title ^(Open File|Save File|Authentication Required|Confirm to replace files|File Upload|All Files)$
windowrule = float 1, match:title ^(Garchy OS — Quick Help & Shortcuts)$
windowrule = center 1, match:title ^(Garchy OS — Quick Help & Shortcuts)$
windowrule = size 740 520, match:title ^(Garchy OS — Quick Help & Shortcuts)$
windowrule = float 1, match:title ^(Gally AI — System Copilot & Hub)$
windowrule = center 1, match:title ^(Gally AI — System Copilot & Hub)$
windowrule = size 860 650, match:title ^(Gally AI — System Copilot & Hub)$
windowrule = float 1, match:title ^(.*Cephalon Gally.*)$
windowrule = center 1, match:title ^(.*Cephalon Gally.*)$
windowrule = size 1040 740, match:title ^(.*Cephalon Gally.*)$
windowrule = float 1, match:class ^(gally_cephalon_hud|Gally_cephalon_hud)$
windowrule = center 1, match:class ^(gally_cephalon_hud|Gally_cephalon_hud)$
windowrule = size 1040 740, match:class ^(gally_cephalon_hud|Gally_cephalon_hud)$
windowrule = rounding 16, match:class ^(gally_cephalon_hud|Gally_cephalon_hud)$
windowrule = opacity 1.0 1.0, match:class ^(gally_cephalon_hud|Gally_cephalon_hud)$
windowrule = float 1, match:title ^(Gally OS — Application Launchpad)$
windowrule = center 1, match:title ^(Gally OS — Application Launchpad)$
windowrule = size 900 640, match:title ^(Gally OS — Application Launchpad)$
windowrule = float 1, match:class ^(gally_launchpad|Gally_launchpad)$
windowrule = center 1, match:class ^(gally_launchpad|Gally_launchpad)$
windowrule = size 900 640, match:class ^(gally_launchpad|Gally_launchpad)$
windowrule = float 1, match:title ^(Gally OS — Visual Theme Gallery)$
windowrule = center 1, match:title ^(Gally OS — Visual Theme Gallery)$
windowrule = size 820 620, match:title ^(Gally OS — Visual Theme Gallery)$
windowrule = float 1, match:title ^(Gally OS — Visual Wallpaper Gallery)$
windowrule = center 1, match:title ^(Gally OS — Visual Wallpaper Gallery)$
windowrule = size 940 680, match:title ^(Gally OS — Visual Wallpaper Gallery)$
windowrule = float 1, match:class ^(gally_wallpaper_gallery|Gally_wallpaper_gallery)$
windowrule = center 1, match:class ^(gally_wallpaper_gallery|Gally_wallpaper_gallery)$
windowrule = size 940 680, match:class ^(gally_wallpaper_gallery|Gally_wallpaper_gallery)$
windowrule = float 1, match:class ^(gally_visualizer)$
windowrule = center 1, match:class ^(gally_visualizer)$
windowrule = size 860 380, match:class ^(gally_visualizer)$
windowrule = float 1, match:title ^(Garchy OS — Graphical System Installer)$
windowrule = center 1, match:title ^(Garchy OS — Graphical System Installer)$
windowrule = size 780 540, match:title ^(Garchy OS — Graphical System Installer)$

# Gaming, Launchers & Emulators Rules (Pinned to Left Monitor DP-2 @ 144Hz, Full Opacity, Immediate Tearing)
windowrule = monitor DP-2, match:class ^(steam_app_.*|gamescope|lutris|heroic|retroarch|net\.pcsx2\.PCSX2|net\.rpcs3\.RPCS3|org\.DolphinEmu\.dolphin-emu|org\.ppsspp\.PPSSPP|info\.cemu\.Cemu|duckstation|io\.github\.ryubing\.Ryujinx|Soulframe.*|launcher\.exe|Soulframe\.x64\.exe|wine|wine64|.*\.exe)$
windowrule = workspace 1, match:class ^(steam_app_.*|gamescope|lutris|heroic|retroarch|net\.pcsx2\.PCSX2|net\.rpcs3\.RPCS3|org\.DolphinEmu\.dolphin-emu|org\.ppsspp\.PPSSPP|info\.cemu\.Cemu|duckstation|io\.github\.ryubing\.Ryujinx|Soulframe.*|launcher\.exe|Soulframe\.x64\.exe)$
windowrule = monitor DP-2, match:title ^(Soulframe.*|Warframe.*|Path of Exile.*|Deep Rock.*|Hitman.*|Fallout.*|Dyson Sphere.*|Dawn of Man.*|Backrooms.*|HunieCam.*|The Bonerooms.*|The Elder Scrolls.*|The Red Lantern.*|GOG GALAXY.*)$
windowrule = workspace 1, match:title ^(Soulframe.*|Warframe.*|Path of Exile.*|Deep Rock.*|Hitman.*|Fallout.*|Dyson Sphere.*|Dawn of Man.*|Backrooms.*|HunieCam.*|The Bonerooms.*|The Elder Scrolls.*|The Red Lantern.*)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(steam_app_.*|gamescope|lutris|heroic|retroarch|net\.pcsx2\.PCSX2|net\.rpcs3\.RPCS3|org\.DolphinEmu\.dolphin-emu|org\.ppsspp\.PPSSPP|info\.cemu\.Cemu|duckstation|io\.github\.ryubing\.Ryujinx|Soulframe.*|launcher\.exe|Soulframe\.x64\.exe|.*\.exe)$
windowrule = immediate 1, match:class ^(steam_app_.*|gamescope|Soulframe.*|launcher\.exe|Soulframe\.x64\.exe|.*\.exe)$
windowrule = fullscreen 0, match:class ^([Ff]allout4\.exe|[Ff]4se_loader\.exe|steam_app_377160)$
windowrule = fullscreen 0, match:title ^(Fallout4)$
windowrule = float 1, match:class ^(ModOrganizer\.exe)$

# Picture-in-Picture & Floating Video Rules (Always On Top, Corner Pinned across all workspaces)
windowrule = float 1, match:title ^(Picture-in-Picture|Picture in picture|Picture in Picture|mpv-pip)$
windowrule = pin 1, match:title ^(Picture-in-Picture|Picture in picture|Picture in Picture|mpv-pip)$
windowrule = size 720 405, match:title ^(Picture-in-Picture|Picture in picture|Picture in Picture|mpv-pip)$
windowrule = float 1, match:class ^(mpv-pip)$
windowrule = pin 1, match:class ^(mpv-pip)$
windowrule = size 720 405, match:class ^(mpv-pip)$

# --------------------------------------------------
# KEYBINDINGS
# --------------------------------------------------
# Gally Launchpad, Gally AI Hub & Quick Help
bind = $mainMod, Space, exec, ~/.config/hypr/scripts/launchpad.sh
bind = $mainMod SHIFT, Space, exec, ~/.config/hypr/scripts/gally-ai-hud.sh
bind = $mainMod, I, exec, ~/.config/hypr/scripts/gally-ai-hud.sh
bind = , F1, exec, ~/.config/hypr/scripts/help-hud.sh
bind = $mainMod, Slash, exec, ~/.config/hypr/scripts/help-hud.sh

# Core Launchers
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod ALT, T, exec, ~/.local/bin/cockpit
bind = $mainMod, D, exec, ~/.config/hypr/scripts/rofi-launcher.sh
bind = $mainMod, R, exec, ~/.config/hypr/scripts/rofi-launcher.sh
bind = $mainMod, Equal, exec, ~/.config/hypr/scripts/rofi-launcher.sh calc
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, Y, exec, ~/.config/hypr/scripts/youtube-pip.sh
bind = $mainMod, P, pin
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/force-kill.sh
bind = $mainMod SHIFT, Escape, exec, hyprctl kill

# Quick Menus & Session
bind = ALT, Tab, exec, ~/.config/hypr/scripts/window-switch.sh
bind = $mainMod, Tab, exec, hyprlock
bind = $mainMod, Escape, exec, wlogout -b 2 -c 20 -r 20
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper-select.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-timer.sh random
bind = $mainMod ALT, W, exec, quickshell -c hyprquickpaper
bind = $mainMod CTRL, R, exec, sh -c 'killall waybar; hyprctl dispatch exec waybar'
bind = $mainMod, O, exec, ~/.config/hypr/scripts/opacity.sh
bind = $mainMod, V, exec, ~/.config/hypr/scripts/clipboard-manager.sh
bind = $mainMod SHIFT, V, exec, kitty --class=gally_visualizer -e cava
bind = $mainMod, C, exec, ~/.config/hypr/scripts/theme-switcher.sh
bind = $mainMod, A, exec, ~/.config/hypr/scripts/easyeffects-menu.sh
bind = $mainMod SHIFT, A, exec, easyeffects

# Window Layout & Maximize / Fullscreen
bind = $mainMod ALT, Space, exec, ~/.config/hypr/scripts/togglefloat.sh
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, G, togglegroup,
bind = $mainMod, bracketleft, changegroupactive, b
bind = $mainMod, bracketright, changegroupactive, f

# Window Minimizing & Restoring
bind = $mainMod, down, exec, ~/.config/hypr/scripts/minimize-window.sh minimize
bind = $mainMod, N, exec, ~/.config/hypr/scripts/minimize-window.sh minimize
bind = $mainMod SHIFT, down, exec, ~/.config/hypr/scripts/minimize-window.sh minimize-all
bind = $mainMod SHIFT, up, exec, ~/.config/hypr/scripts/minimize-window.sh restore-last
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/minimize-window.sh restore-last
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/minimize-window.sh restore-all
bind = $mainMod, Z, exec, ~/.config/hypr/scripts/window-switch.sh
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod CTRL, S, movetoworkspace, special:magic

# Screenshots (Non-conflicting)
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh full
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh window

# Mouse Window Control
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Exit Session
bind = $mainMod SHIFT, E, exit,

# Window Focus (Vim HJKL + Arrow Keys)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, comma, focusmonitor, -1
bind = $mainMod, period, focusmonitor, +1

# Move Active Window across Tiling & Monitors
bind = $mainMod SHIFT, comma, movewindow, mon:-1
bind = $mainMod SHIFT, period, movewindow, mon:+1
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r

# Resize Active Window (Hold to repeat)
binde = $mainMod CTRL, H, resizeactive, -40 0
binde = $mainMod CTRL, L, resizeactive, 40 0
binde = $mainMod CTRL, K, resizeactive, 0 -40
binde = $mainMod CTRL, J, resizeactive, 0 40
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# Dual-Monitor Synchronized Desktop Navigation (Desktops 1..10)
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/dual-desktop.sh switch 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/dual-desktop.sh switch 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/dual-desktop.sh switch 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/dual-desktop.sh switch 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/dual-desktop.sh switch 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/dual-desktop.sh switch 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/dual-desktop.sh switch 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/dual-desktop.sh switch 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/dual-desktop.sh switch 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/dual-desktop.sh switch 10

# Move Window to Dual-Monitor Desktop (Desktops 1..10)
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/dual-desktop.sh move 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/dual-desktop.sh move 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/dual-desktop.sh move 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/dual-desktop.sh move 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/dual-desktop.sh move 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/dual-desktop.sh move 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/dual-desktop.sh move 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/dual-desktop.sh move 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/dual-desktop.sh move 9
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/dual-desktop.sh move 10

# Media Keys & Audio (with smooth 5% step)
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, ~/.config/hypr/scripts/media-control.sh play-pause
bindl = , XF86AudioNext, exec, ~/.config/hypr/scripts/media-control.sh next
bindl = , XF86AudioPrev, exec, ~/.config/hypr/scripts/media-control.sh previous
bindl = , XF86AudioStop, exec, ~/.config/hypr/scripts/media-control.sh stop
