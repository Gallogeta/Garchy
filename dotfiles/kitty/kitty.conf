# ==============================================================================
# 🌌 Garchy OS — Ultra-Modern Kitty Terminal Configuration
# ==============================================================================

# --- Typography & Font Rendering ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
modify_font      cell_height 108%

# Box drawing and symbols
box_drawing_scale 0.001, 1, 1.5, 2

# --- Glassmorphism & Translucency ---
background_opacity 0.88
background_blur    20
dynamic_background_opacity yes

# --- Window Layout & Spacing ---
window_padding_width 14 16
placement_strategy   center
hide_window_decorations yes
remember_window_size  yes
initial_window_width  1040
initial_window_height 640
confirm_os_window_close 0

# --- Smooth Kinetic Cursor (Kitty 0.48+) ---
cursor_shape                 block
cursor_blink_interval        0.5
cursor_stop_blinking_after   15.0
cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# --- Interactive URLs & Hyperlinks ---
detect_urls          yes
url_style            curly
open_url_with        default
underline_hyperlinks always

# --- Scrollback & Buffer ---
scrollback_lines          50000
scrollback_pager_history_size 64
wheel_scroll_multiplier   3.0
touch_scroll_multiplier   3.0

# --- Copy, Paste & Selection ---
copy_on_select           yes
strip_trailing_spaces    smart
select_by_word_characters @-./_~?&=%+#

# --- Tabs & Powerline Slanted Bar ---
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      1
tab_title_template    " {index}: {title} "
active_tab_font_style bold

# --- Window Layouts & Splits ---
enabled_layouts splits,stack,tall,fat,grid

# Keybindings for Tiling & Splits
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+d     launch --location=vsplit --cwd=current
map ctrl+shift+s     launch --location=hsplit --cwd=current
map ctrl+shift+w     close_window
map ctrl+shift+h     neighboring_window left
map ctrl+shift+l     neighboring_window right
map ctrl+shift+k     neighboring_window up
map ctrl+shift+j     neighboring_window down

# Tab Navigation
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+q     close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

# Font Zoom Controls
map ctrl+equal       change_font_size all +1.0
map ctrl+plus        change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           change_font_size all 0

# Clipboard
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard

# Search Scrollback
map ctrl+shift+f     show_scrollback

# Shell Integration
shell_integration    enabled

# --- Dynamic Theme Palette (Synced via theme-switcher-gui.py) ---
include theme.conf
